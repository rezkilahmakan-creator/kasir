<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir Acil</title>
<style>body{font-family:sans-serif;padding:10px;background:#eee}button{padding:9px;margin:2px;border:0;border-radius:8px;background:#1976d2;color:#fff}.b{background:#fff;color:#000;border:1px solid #ccc}div.x{background:#fff;border-radius:9px;padding:9px;margin:7px 0}input,select{width:100%;padding:8px;margin:2px 0;box-sizing:border-box}.r{color:red}</style></head><body>
<h2>Kasir Warung Acil</h2><button style="width:100%;background:#d32f2f" onclick="dg()">🎤 Ucapkan pesanan</button><p id="dt"></p>
<div class="x" id="br"></div>
<div class="x"><div id="kr"></div><h3>Total: <span id="tt"></span></h3><select id="mt"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select>
<input id="ug" type="number" placeholder="Uang dibayar" oninput="tp()">Kembalian: <b id="kb"></b><br><button onclick="by()">✅ Bayar</button><button class="b" onclick="K={};tp()">Kosongkan</button></div>
<div class="x"><b>Stok</b><div id="st"></div></div>
<div class="x"><b>Barang baru</b><input id="a" placeholder="Nama"><input id="b" type="number" placeholder="Harga ecer"><input id="c" type="number" placeholder="Harga jual per dus"><input id="d" type="number" placeholder="Modal per dus"><input id="e" type="number" placeholder="Isi per dus"><button onclick="tb()">Simpan</button></div>
<div class="x" id="lp"></div>
<script>
let B=JSON.parse(localStorage.B||'[{"n":"Aqua 600","e":3000,"j":46000,"m":45000,"i":24,"s":0},{"n":"Aqua Besar","e":5000,"j":51000,"m":50000,"i":12,"s":0}]'),J=JSON.parse(localStorage.J||'[]'),K={},T=0;
const R=x=>'Rp'+Math.round(x).toLocaleString('id-ID'),sv=()=>{localStorage.B=JSON.stringify(B);localStorage.J=JSON.stringify(J)},
N={satu:1,dua:2,tiga:3,empat:4,lima:5,enam:6,tujuh:7,delapan:8,sembilan:9,sepuluh:10},
H=k=>k[1]=='d'?B[k[0]].j:B[k[0]].e,P=(k,q)=>k[1]=='d'?q*B[k[0]].i:q;
function tp(){T=0;br.innerHTML=B.map((b,i)=>`${b.n} <button class="b" onclick="ad('${i}e',1)">Ecer ${R(b.e)}</button><button class="b" onclick="ad('${i}d',1)">Dus ${R(b.j)}</button><br>`).join('');
kr.innerHTML=Object.keys(K).map(k=>{let s=H(k)*K[k];T+=s;return `${B[k[0]].n} ${k[1]=='d'?'dus':'ecer'} x${K[k]} = ${R(s)} <button class="b" onclick="ad('${k}',-1)">−</button><br>`}).join('')||'Kosong';
tt.textContent=R(T);kb.textContent=R(Math.max(0,(+ug.value||0)-T));
st.innerHTML=B.map((b,i)=>`<span class="${b.s<b.i?'r':''}">${b.n}: ${b.s} biji</span> <button class="b" onclick="ts(${i})">+Dus</button><button class="b" onclick="if(confirm('Hapus?')){B.splice(${i},1);K={};sv();tp()}">🗑</button><br>`).join('');
let d=new Date().toDateString(),h=J.filter(x=>new Date(x.w).toDateString()==d),s=f=>h.reduce((a,x)=>a+f(x),0);
lp.innerHTML=`<b>Hari ini</b>: ${h.length} transaksi<br>Total ${R(s(x=>x.t))}<br>Untung ${R(s(x=>x.u))}`}
function ad(k,q){K[k]=(K[k]||0)+q;if(K[k]<=0)delete K[k];tp()}
function by(){if(!T)return;let u=0;for(let k in K){let b=B[k[0]],p=P(k,K[k]);b.s-=p;u+=H(k)*K[k]-p*b.m/b.i}
J.push({w:Date.now(),t:T,u,m:mt.value});sv();K={};ug.value='';tp();alert('Tersimpan!')}
function ts(i){let q=+prompt('Tambah berapa dus?','1');if(q>0){B[i].s+=q*B[i].i;sv();tp()}}
function tb(){if(!a.value||!b.value)return;let x=+e.value||1;B.push({n:a.value,e:+b.value,j:+c.value||b.value*x,m:+d.value||0,i:x,s:0});sv();a.value=b.value=c.value=d.value=e.value='';tp()}
function dg(){let S=window.SpeechRecognition||window.webkitSpeechRecognition,r=new S();r.lang='id-ID';
r.onresult=ev=>{let t=ev.results[0][0].transcript.toLowerCase();dt.textContent=t;
B.forEach((b,i)=>{let m=t.match(new RegExp(b.n.toLowerCase()+'\\s*(\\d+|\\w+)?\\s*(dus)?'));if(m){let q=+m[1]||N[m[1]]||1;ad(i+(m[2]?'d':'e'),q)}})};r.start()}
tp();
</script></body></html>
