 const ks=Object.keys(g);if(!ks.length){rk.innerHTML='<span class="s">Belum ada transaksi hari ini</span>';rw.innerHTML='';return}
 const S=f=>ks.reduce((a,k)=>a+f(g[k]),0);
 rk.innerHTML=`<table><tr><th>Kasir</th><th>Cash</th><th>QRIS</th><th>Transfer</th><th>Total</th><th>Untung</th></tr>${ks.map(k=>`<tr><td>${esc(k)}</td><td>${R(g[k].Tunai)}</td><td>${R(g[k].QRIS)}</td><td>${R(g[k].Transfer)}</td><td>${R(g[k].t)}</td><td>${R(g[k].u)}</td></tr>`).join('')}<tr><th>Total</th><th>${R(S(r=>r.Tunai))}</th><th>${R(S(r=>r.QRIS))}</th><th>${R(S(r=>r.Transfer))}</th><th>${R(S(r=>r.t))}</th><th>${R(S(r=>r.u))}</th></tr></table>`;
 rw.innerHTML='Terakhir: '+h.slice(-5).reverse().map(x=>`${new Date(x.w).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} ${esc(x.k)} ${R(x.t)} ${x.m}${x.p?' ('+esc(x.p)+')':''}`).join(' · ')}
function salin(){const h=hariIni();let t=`Rekap ${new Date().toLocaleDateString('id-ID')}\n`;const g={};
 h.forEach(x=>{const r=g[x.k]=g[x.k]||{Tunai:0,QRIS:0,Transfer:0,it:{}};r[x.m]+=x.t;x.it.forEach(i=>{const key=i.n+' ('+i.s+')';r.it[key]=(r.it[key]||0)+i.q})});
 for(const k in g)t+=`\n${k}: cash ${g[k].Tunai}, QRIS ${g[k].QRIS}, transfer ${g[k].Transfer}\nTerjual: `+Object.entries(g[k].it).map(([n,q])=>`${n} ${q}`).join(', ')+'\n';
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>msg.innerHTML='<span class="ok">Rekap disalin, tinggal tempel ke Claude</span>').catch(()=>prompt('Salin rekap ini:',t))}
function dstok(){const q=(cs.value||'').toLowerCase();st.innerHTML=B.map((b,i)=>[b,i]).filter(([b])=>!q||b.n.toLowerCase().includes(q)).map(([b,i])=>
 `<div class="it"><div><b>${esc(b.n)}</b><div class="s">jual ${R(b.jk)}/${b.k}${b.jb?` · ${R(b.jb)}/${b.u} (isi ${b.i})`:''} · modal ${R(b.mk)}/${b.k}</div><div class="s ${b.s<=0?'red':''}">stok ${b.s} ${b.k}</div></div><div style="flex:0 0 auto"><button class="l" onclick="stokM(${i})">+Stok</button><button class="l" onclick="ubah(${i})">✏️</button><button class="l" onclick="if(confirm('Hapus ${esc(b.n).replace(/'/g,'')}?')){B.splice(${i},1);K=[];sv();tp();dstok()}">🗑</button></div></div>`).join('')}
function stokM(i){const b=B[i];const q=prompt(`Tambah stok ${b.n}. Angka saja = ${b.k}${b.jb?`, atau tulis misal "2 ${b.u}"`:''}:`,'');if(!q)return;
 const n=parseFloat(q);if(!(n>0))return;B[i].s+=(b.jb&&q.toLowerCase().includes(b.u)?n*b.i:n);sv();dstok();dl()}
function ubah(i){const b=B[i];const j=prompt(`Harga jual per ${b.k} untuk ${b.n}:`,b.jk);if(j===null)return;b.jk=+j||b.jk;
 if(b.jb){const jb=prompt(`Harga jual per ${b.u}:`,b.jb);if(jb!==null)b.jb=+jb||b.jb}sv();dstok();dl();tp()}
function tambah(){if(!nn.value||!njk.value){alert('Isi nama dan harga jual');return}const i=+ni.value||1;
 B.push({n:nn.value.trim(),k:nk.value.trim()||'pcs',jk:+njk.value,mk:+nmk.value||0,i,u:njb.value?(nu.value.trim()||'dus'):'',jb:+njb.value||0,mb:(+nmk.value||0)*i,s:0});
 [nn,nk,njk,nmk,ni,nu,njb].forEach(x=>x.value='');sv();dstok();msg.innerHTML='<span class="ok">Barang ditambahkan</span>'}

// ===== Suara =====
const SAT={satu:1,se:1,dua:2,tiga:3,empat:4,lima:5,enam:6,tujuh:7,delapan:8,sembilan:9};
function angka(t){ // ubah kata bilangan jadi angka
 t=t.toLowerCase().replace(/[-,.!?]/g,' ').replace(/\bse(bungkus|slop|slof|dus|pak|biji|pcs|renteng|box|karton)\b/g,'1 $1')
  .replace(/\b(slof|selop|selof|slo)\b/g,'slop').replace(/\b(kris|keris|kiris|qris|kyuris)\b/g,'qris').replace(/\b(kes|cash|kontan|tunai)\b/g,'tunai').replace(/\btf\b/g,'transfer');
 const w=t.split(/\s+/).filter(Boolean),o=[];
 const U=i=>SAT[w[i]]!=null&&w[i]!='se'?SAT[w[i]]:null;
 function r999(i){let v=0,ok=false;
  if(w[i]=='seratus'){v=100;i++;ok=true}else if(U(i)!=null&&w[i+1]=='ratus'){v=U(i)*100;i+=2;ok=true}
  if(w[i]=='sepuluh'){v+=10;i++;ok=true}else if(w[i]=='sebelas'){v+=11;i++;ok=true}
  else if(U(i)!=null&&w[i+1]=='belas'){v+=10+U(i);i+=2;ok=true}
  else if(U(i)!=null&&w[i+1]=='puluh'){v+=U(i)*10;i+=2;ok=true;if(U(i)!=null){v+=U(i);i++}}
  else if(U(i)!=null){v+=U(i);i++;ok=true}
  return ok?[v,i]:null}
 for(let i=0;i<w.length;){let v=null,j=i;
  if(w[i]=='seribu'){v=1000;j=i+1;const r=r999(j);if(r){v+=r[0];j=r[1]}}
  else{const r=r999(i);if(r){v=r[0];j=r[1];if(w[j]=='ribu'){v*=1000;j++;const r2=r999(j);if(r2){v+=r2[0];j=r2[1]}}}}
  if(v!=null){o.push(String(v));i=j}else{o.push(w[i]);i++}}
 return o}
const norm=s=>s.toLowerCase().replace(/[-+()]/g,' ').replace(/\s+/g,' ').trim();
function kunci(){const L=[];const base={};
 B.forEach((b,i)=>{const f=norm(b.n);L.push({t:f.split(' '),i});const m=f.match(/^(.*\D)\s+\d+$/);if(m){(base[m[1]]=base[m[1]]||[]).push(i)}});
 for(const k in base){if(base[k].length==1&&!L.some(x=>x.t.join(' ')==k))L.push({t:k.split(' '),i:base[k][0]});else if(base[k].length>1)L.push({t:k.split(' '),amb:base[k]})}
 return L.sort((a,b)=>b.t.length-a.t.length)}
function proses(teks){if(!teks)return;dt.textContent='"'+teks+'"';const w=angka(teks),L=kunci();let metode=null,dapat=[],ragu=[],sisa=[];
 for(let p=0;p<w.length;){
  if(['tunai','qris','transfer'].includes(w[p])){metode={tunai:'Tunai',qris:'QRIS',transfer:'Transfer'}[w[p]];p++;continue}
  const m=L.find(x=>x.t.every((t,k)=>w[p+k]==t));
  if(!m){if(!['dan','sama','terus','lagi','ya','nya'].includes(w[p]))sisa.push(w[p]);p++;continue}
  p+=m.t.length;let q=1,u=null;
  for(let k=0;k<2&&p<w.length;k++){if(/^\d+$/.test(w[p])&&q==1&&k<2&&!u){q=+w[p];p++}else if(['slop','dus','pak','karton','box','bungkus','biji','pcs','renteng','lapiak'].includes(w[p])){u=w[p];p++}else break}
  if(m.amb){ragu.push(m.amb.map(i=>B[i].n).join(' / '));continue}
  const b=B[m.i],big=!!(u&&b.jb&&u==b.u&&u!=b.k);addK(m.i,big,q);dapat.push(`${b.n} ${q} ${sat(b,big)}`)}
 let h='';if(dapat.length)h+=`<span class="ok">+ ${esc(dapat.join(', '))}</span><br>`;
 if(ragu.length)h+=`<span class="bad">Sebut ukurannya: ${esc(ragu.join('; '))}</span><br>`;
 if(sisa.length&&!dapat.length)h+=`<span class="bad">Tidak dikenali: ${esc(sisa.join(' '))}</span>`;
 msg.innerHTML=h;tk.value='';
 if(metode){if(ragu.length){mt.value=metode;msg.innerHTML+='<br><span class="bad">Belum disimpan, lengkapi dulu lalu tekan Bayar</span>'}else if(K.length){mt.value=metode;bayar(metode)}}}
function dengar(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){msg.innerHTML='<span class="bad">Browser ini belum bisa suara. Pakai kolom ketik + mikrofon keyboard.</span>';return}
 const r=new S();r.lang='id-ID';r.interimResults=false;mic.classList.add('on');mic.textContent='🎙️ Mendengarkan…';
 r.onresult=e=>proses(e.results[0][0].transcript);r.onerror=e=>msg.innerHTML='<span class="bad">Suara gagal: '+esc(e.error)+'</span>';
 r.onend=()=>{mic.classList.remove('on');mic.textContent='🎤 Ucapkan pesanan'};r.start()}
sv();tp();dstok();
</script></body></html>
